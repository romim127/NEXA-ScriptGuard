name: frontend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:demo
      - name: Verify versioned production bundle
        run: test -z "$(git status --porcelain -- nexa_scriptguard/gui_assets/modern)"
      - name: Install local Python distribution with pipx
        env:
          PIPX_HOME: ${{ runner.temp }}/pipx-home
          PIPX_BIN_DIR: ${{ runner.temp }}/pipx-bin
        run: |
          python -m pip install pipx
          python -m pipx install .
          "$PIPX_BIN_DIR/RUN" --help
          "$PIPX_HOME/venvs/nexa-scriptguard/bin/python" -m frontend.demo.generate_reports
          test -z "$(git status --porcelain -- frontend/demo/public/reports)"
          echo "NEXA_RUN=$PIPX_BIN_DIR/RUN" >> "$GITHUB_ENV"
          echo "NEXA_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
