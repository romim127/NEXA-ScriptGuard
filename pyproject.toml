[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexa-scriptguard"
version = "0.5.0a1"
description = "Experimental read-only shell-script static analyzer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13,<15",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-bash==0.25.1",
]
license = "MIT"
authors = [{name = "NextGenAI Infinity"}]

[project.optional-dependencies]
test = ["jsonschema>=4.23,<5"]

[project.scripts]
RUN = "nexa_scriptguard.gui:main"
nexa-scriptguard = "nexa_scriptguard.__main__:main"
nexa-scriptguard-gui = "nexa_scriptguard.gui:main"

[tool.setuptools]
packages = ["nexa_scriptguard"]
[tool.setuptools.package-data]
nexa_scriptguard = ["bash.json", "python_rules.json", "gui_assets/*.html", "gui_assets/*.css", "gui_assets/*.js", "gui_assets/*.svg"]
